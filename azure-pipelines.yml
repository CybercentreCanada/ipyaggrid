trigger:
  batch: true
  branches:
    include:
      - cccs-*

pool:
  vmImage: 'ubuntu-latest'

variables:
  tag: '$(Build.BuildId)'

stages:
  - stage: Build_and_Publish_Python_Artifact
    displayName: Build, package and publish python artifacts.
    jobs:
      - job: BuildPythonArtifact
        displayName: Build and package python artifacts.
        strategy:
          matrix:
            Python:
              python.version: '3.10'

        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: |
              pip install wheel "jupyterlab==4.3.0"
            displayName: 'Install dependencies'

          - script: |
              cd js
              npm ci
              npm run build:labextension
              npm pack
            displayName: 'Package js'

          - script: |
              python setup.py sdist bdist_wheel --universal
            displayName: 'Package'

          - task: CopyFiles@2
            inputs:
              contents: 'dist/**'
              targetFolder: $(Build.ArtifactStagingDirectory)
            displayName: 'Stage build artifact to publish'

          - task: PublishBuildArtifacts@1
            inputs:
              pathtoPublish: '$(Build.ArtifactStagingDirectory)/dist'
              artifactName: 'dist'
              publishLocation: 'Container'
            displayName: 'Publish build artifacts'

      - job: PublishArtifactToAPAFeed
        displayName: Publish artifact to APA feed
        dependsOn: BuildPythonArtifact
        steps:
          - script: |
              rm -rf $(Pipeline.Workspace)/dist/*
            displayName: 'Clean dist directory before download'

          - task: DownloadBuildArtifacts@0
            inputs:
              buildType: 'current'
              downloadType: 'specific'
              downloadPath: '$(Pipeline.Workspace)'
            displayName: 'Download build artifact'

          - task: TwineAuthenticate@1
            inputs:
              artifactFeed: Analytical Platform/analytical-platform
            displayName: 'Twine Authenticate'

          - script: |
              virtualenv -p python$(python.version) env
              source env/bin/activate
              pip install twine

              set -o pipefail
              if ! python -m twine upload -r analytical-platform --config-file $(PYPIRC_PATH) $(Pipeline.Workspace)/dist/* --verbose 2>&1 | tee twine.log; then
                if grep -q "409" twine.log; then
                  echo "Package already exists (409 Conflict) — skipping"
                  exit 0
                else
                  exit 1
                fi
              fi
            displayName: 'Publish artifact to analytical-platform feed'
